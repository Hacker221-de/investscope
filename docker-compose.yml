services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investscope}
      POSTGRES_USER: ${POSTGRES_USER:-investscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investscope}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      INVESTSCOPE_DATABASE_URL: ${INVESTSCOPE_DATABASE_URL:-postgresql+psycopg://investscope:investscope@db:5432/investscope}
      INVESTSCOPE_CORS_ORIGINS: '["http://localhost:3000"]'
      INVESTSCOPE_MARKET_DATA_PROVIDER: ${INVESTSCOPE_MARKET_DATA_PROVIDER:-demo}
      INVESTSCOPE_ALPHA_VANTAGE_API_KEY: ${INVESTSCOPE_ALPHA_VANTAGE_API_KEY:-}
      INVESTSCOPE_ALPHA_VANTAGE_BASE_URL: ${INVESTSCOPE_ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co/query}
      INVESTSCOPE_ALPHA_VANTAGE_DAILY_LIMIT: ${INVESTSCOPE_ALPHA_VANTAGE_DAILY_LIMIT:-25}
      INVESTSCOPE_ALPHA_VANTAGE_DAILY_RESERVE: ${INVESTSCOPE_ALPHA_VANTAGE_DAILY_RESERVE:-1}
      INVESTSCOPE_ALPHA_VANTAGE_MIN_INTERVAL_SECONDS: ${INVESTSCOPE_ALPHA_VANTAGE_MIN_INTERVAL_SECONDS:-1.5}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_ROOT: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
